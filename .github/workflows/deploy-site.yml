name: Sync, Build, and Deploy

# ─── Trigger decision ─────────────────────────────────────────────────────────
#
# We use TWO triggers, both documented here:
#
# 1. SCHEDULED (nightly at 02:00 UTC)
#    Rationale: Simple, zero-configuration, survives without any secret-token
#    setup in the core repo. A 24-hour lag is acceptable for documentation; the
#    core repo's content doesn't change hourly. Nightly is the right cadence
#    for v1 — revisit to `repository_dispatch` if reviewers want sub-hour sync.
#
# 2. MANUAL (workflow_dispatch)
#    Rationale: Lets any maintainer force a sync immediately after a doc fix
#    lands in salazarsebas/Cougr, without waiting for the nightly window.
#    Also useful for first-run testing when setting up the repo.
#
# NOT used: repository_dispatch triggered from salazarsebas/Cougr CI
#    Why not: That approach requires a Personal Access Token stored as a secret
#    in the core repo pointing at THIS repo. That's a non-trivial cross-repo
#    secret management burden for v1 and adds a failure mode (token rotation)
#    with no real benefit at current doc-change frequency.
#    Revisit as: `on: repository_dispatch: types: [docs-updated]` once a
#    dedicated bot token or GitHub App is in place.
#
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC nightly
  workflow_dispatch: # manual trigger from the Actions tab
  push:
    branches: [main] # also re-deploy on any direct push to main (e.g. nav fixes)

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; cancel in-progress if a new run starts.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  sync-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout cougr-site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync content from monorepo
        run: cd cougr-site && python3 sync.py
        # sync.py copies docs/*.md, ARCHITECTURE.md, CHANGELOG.md, and docs/adr/*.md
        # from the parent directory into src/, and rewrites relative markdown links
        # for mdBook's directory layout.

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz --directory=/usr/local/bin

      - name: Build site
        run: cd cougr-site && mdbook build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cougr-site/book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
